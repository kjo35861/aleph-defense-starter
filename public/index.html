<!doctype html>
<!-- Step 5: browser talks only to server functions for auth and note data. -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,sans-serif; }
    body { margin:0; min-height:100vh; background:#101a28; color:#ecf4ff; }
    main { max-width:760px; margin:0 auto; padding:44px 22px 64px; }
    .eyebrow { color:#8ad8df; font-size:14px; font-weight:700; letter-spacing:.08em; }
    h1 { margin:16px 0; font-size:clamp(30px,7vw,48px); }
    h2 { margin:0 0 14px; font-size:22px; }
    p { color:#bfd0e5; line-height:1.7; }
    .panel { margin:24px 0; padding:20px; border:1px solid #51667c; border-radius:14px; background:#162438; }
    form { display:grid; gap:12px; }
    label { display:grid; gap:6px; font-weight:700; }
    input,textarea { box-sizing:border-box; width:100%; padding:11px 12px; border:1px solid #60758b; border-radius:9px; background:#0f1a28; color:#f4f8ff; }
    textarea { min-height:90px; resize:vertical; }
    button { padding:10px 16px; border:0; border-radius:9px; cursor:pointer; font-weight:700; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .error { min-height:1.4em; color:#ffadb9; }
    [hidden] { display:none !important; }
    ul { list-style:none; display:grid; gap:12px; padding:0; }
    li { border:1px solid #51667c; border-radius:14px; padding:17px 19px; background:#1a2a3d; }
    strong { display:block; font-size:18px; margin-bottom:5px; }
    li span { color:#bfd0e5; white-space:pre-wrap; }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">BYTE BACK · 5단계 서버 한곳으로</div>
  <h1>내 자료실</h1>
  <p>로그인한 사용자는 자신의 메모 목록을 보고 메모를 추가·수정·삭제할 수 있습니다.</p>

  <section class="panel">
    <h2>로그인</h2>
    <p id="auth-status">로그인 상태를 확인하는 중입니다.</p>
    <form id="login-form">
      <label>이메일<input id="email" type="email" autocomplete="username" required></label>
      <label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
      <div class="actions"><button type="submit">로그인</button><button id="signup-button" type="button">회원가입</button></div>
    </form>
    <button id="logout-button" type="button" hidden>로그아웃</button>
    <p id="auth-error" class="error" role="alert"></p>
  </section>

  <section id="editor" class="panel" hidden>
    <h2>메모 추가</h2>
    <form id="note-form">
      <label>제목<input id="note-title" maxlength="500" required></label>
      <label>내용<textarea id="note-body" maxlength="5000" required></textarea></label>
      <button type="submit">추가</button>
    </form>
    <p id="note-error" class="error" role="alert"></p>
  </section>

  <ul id="notes" aria-live="polite"><li>로그인하면 자료를 불러옵니다.</li></ul>
</main>

<script type="module">

  const status = document.querySelector('#auth-status');
  const authError = document.querySelector('#auth-error');
  const noteError = document.querySelector('#note-error');
  const loginForm = document.querySelector('#login-form');
  const signupButton = document.querySelector('#signup-button');
  const logoutButton = document.querySelector('#logout-button');
  const editor = document.querySelector('#editor');
  const noteForm = document.querySelector('#note-form');
  const emailInput = document.querySelector('#email');
  const passwordInput = document.querySelector('#password');
  const titleInput = document.querySelector('#note-title');
  const bodyInput = document.querySelector('#note-body');
  const list = document.querySelector('#notes');
  let session = null;

  const saved = sessionStorage.getItem('byteback_session');
  if (saved) {
    try { session = JSON.parse(saved); } catch { sessionStorage.removeItem('byteback_session'); }
  }

  async function api(path, options = {}) {
    if (!session?.access_token) throw new Error('로그인이 필요합니다.');
    const response = await fetch(path, {
      ...options,
      cache: 'no-store',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${session.access_token}`,
        ...(options.headers ?? {}),
      },
    });
    if (response.status === 204) return null;
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error ?? `HTTP ${response.status}`);
    return payload;
  }

  function noteItem(note) {
    const item = document.createElement('li');
    const title = document.createElement('strong');
    const body = document.createElement('span');
    const actions = document.createElement('div');
    const edit = document.createElement('button');
    const remove = document.createElement('button');

    title.textContent = note.title;
    body.textContent = note.body;
    actions.className = 'actions';
    edit.textContent = '수정';
    remove.textContent = '삭제';

    edit.addEventListener('click', async () => {
      const nextTitle = prompt('제목', note.title);
      if (nextTitle === null) return;
      const nextBody = prompt('내용', note.body);
      if (nextBody === null) return;
      noteError.textContent = '';
      try {
        await api(`/api/notes/${encodeURIComponent(note.id)}`, {
          method: 'PUT',
          body: JSON.stringify({ title: nextTitle, body: nextBody }),
        });
        await loadNotes();
      } catch (error) { noteError.textContent = `수정 실패: ${error.message}`; }
    });

    remove.addEventListener('click', async () => {
      if (!confirm('이 메모를 삭제할까요?')) return;
      noteError.textContent = '';
      try {
        await api(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
        await loadNotes();
      } catch (error) { noteError.textContent = `삭제 실패: ${error.message}`; }
    });

    actions.append(edit, remove);
    item.append(title, body, actions);
    return item;
  }

  async function loadNotes() {
    if (!session) {
      list.replaceChildren(Object.assign(document.createElement('li'), { textContent:'로그인하면 자료를 불러옵니다.' }));
      return;
    }
    try {
      const notes = await api('/api/notes');
      if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
      list.replaceChildren(...(notes.length ? notes.map(noteItem) : [
        Object.assign(document.createElement('li'), { textContent:'아직 내 메모가 없습니다.' }),
      ]));
    } catch (error) {
      list.replaceChildren(Object.assign(document.createElement('li'), { textContent:`자료 읽기 실패: ${error.message}` }));
    }
  }

  async function renderAuth(nextSession) {
    session = nextSession;
    const signedIn = Boolean(session?.user);
    status.textContent = signedIn ? `로그인됨: ${session.user.email ?? '이메일 확인 불가'}` : '로그아웃 상태입니다.';
    loginForm.hidden = signedIn;
    logoutButton.hidden = !signedIn;
    editor.hidden = !signedIn;
    if (signedIn) passwordInput.value = '';
    await loadNotes();
  }

  await renderAuth(session);

  signupButton.addEventListener('click', async () => {
    authError.textContent = '';
    const response = await fetch('/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: emailInput.value.trim(), password: passwordInput.value }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      authError.textContent = `회원가입 실패: ${data.error ?? `HTTP ${response.status}`}`;
      return;
    }
    if (data.accessToken) {
      session = { access_token: data.accessToken, user: { email: data.email } };
      sessionStorage.setItem('byteback_session', JSON.stringify(session));
      await renderAuth(session);
    } else {
      authError.textContent = '회원가입 요청 완료. 이메일 확인이 필요하면 확인 후 로그인하세요.';
    }
  });

  loginForm.addEventListener('submit', async event => {
    event.preventDefault();
    authError.textContent = '';
    const response = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: emailInput.value.trim(), password: passwordInput.value }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      authError.textContent = `로그인 실패: ${data.error ?? `HTTP ${response.status}`}`;
      return;
    }
    session = { access_token: data.accessToken, user: { email: data.email } };
    sessionStorage.setItem('byteback_session', JSON.stringify(session));
    await renderAuth(session);
  });

  logoutButton.addEventListener('click', async () => {
    authError.textContent = '';
    session = null;
    sessionStorage.removeItem('byteback_session');
    await renderAuth(null);
  });

  noteForm.addEventListener('submit', async event => {
    event.preventDefault();
    noteError.textContent = '';
    try {
      await api('/api/notes', {
        method: 'POST',
        body: JSON.stringify({ title: titleInput.value, body: bodyInput.value }),
      });
      titleInput.value = '';
      bodyInput.value = '';
      await loadNotes();
    } catch (error) { noteError.textContent = `추가 실패: ${error.message}`; }
  });
</script>
</body>
</html>
