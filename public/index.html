<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <title>BYTE BACK | 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,sans-serif; }
    body { margin:0; min-height:100vh; background:#101a28; color:#ecf4ff; }
    main { max-width:760px; margin:0 auto; padding:44px 22px 64px; }
    .eyebrow { color:#8ad8df; font-size:14px; font-weight:700; letter-spacing:.08em; }
    h1 { margin:16px 0; font-size:clamp(30px,7vw,48px); }
    h2 { margin:0 0 14px; font-size:22px; }
    p { color:#bfd0e5; line-height:1.7; }
    .panel { margin:24px 0; padding:20px; border:1px solid #51667c; border-radius:14px; background:#162438; }
    form { display:grid; gap:12px; }
    label { display:grid; gap:6px; font-weight:700; }
    input,textarea { box-sizing:border-box; width:100%; padding:11px 12px; border:1px solid #60758b; border-radius:9px; background:#0f1a28; color:#f4f8ff; }
    textarea { min-height:90px; resize:vertical; }
    button { padding:10px 16px; border:0; border-radius:9px; cursor:pointer; font-weight:700; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .error { min-height:1.4em; color:#ffadb9; }
    .status-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    .status-card { padding:14px; border:1px solid #51667c; border-radius:12px; background:#101d2d; }
    .status-card strong { font-size:14px; color:#8ad8df; }
    .status-card span { display:block; margin-top:6px; color:#ecf4ff; line-height:1.5; }
    .muted { font-size:14px; color:#9fb3c9; }
    [hidden] { display:none !important; }
    ul { list-style:none; display:grid; gap:12px; padding:0; }
    li { border:1px solid #51667c; border-radius:14px; padding:17px 19px; background:#1a2a3d; }
    strong { display:block; font-size:18px; margin-bottom:5px; }
    li span { color:#bfd0e5; white-space:pre-wrap; }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">BYTE BACK · 보호된 자료실</div>
  <h1>내 자료실</h1>
  <p>로그인 뒤 서버가 이 기기의 등록 상태를 확인한 경우에만 보호 자료를 표시합니다.</p>

  <section class="panel" aria-labelledby="app-status-title">
    <h2 id="app-status-title">앱 및 기기 상태</h2>
    <div class="status-grid">
      <div class="status-card"><strong>설치 상태</strong><span id="install-status">확인 중입니다.</span></div>
      <div class="status-card"><strong>기기 승인 상태</strong><span id="device-status">서버 확인 전입니다.</span></div>
      <div class="status-card"><strong>네트워크 상태</strong><span id="network-status">확인 중입니다.</span></div>
    </div>
    <div class="actions"><button id="install-button" type="button" hidden>앱 설치</button></div>
    <p class="muted">앱 설치 여부는 기기 승인을 뜻하지 않습니다. 승인 상태는 서버의 등록 레코드로만 확인합니다.</p>
  </section>

  <section class="panel">
    <h2>로그인</h2>
    <p id="auth-status">로그인 상태를 확인하는 중입니다.</p>
    <form id="login-form">
      <label>이메일<input id="email" type="email" autocomplete="username" required></label>
      <label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
      <div class="actions"><button type="submit">로그인</button><button id="signup-button" type="button">회원가입</button></div>
    </form>
    <button id="logout-button" type="button" hidden>로그아웃</button>
    <p id="auth-error" class="error" role="alert"></p>
  </section>

  <section id="approval-panel" class="panel" hidden>
    <h2>기기 승인</h2>
    <p>이 기기는 아직 서버에 등록되지 않았습니다. 승인 요청 시 비밀번호를 다시 확인한 뒤 서버가 등록 레코드를 만듭니다.</p>
    <form id="approval-form">
      <label>비밀번호 재확인<input id="approval-password" type="password" autocomplete="current-password" required></label>
      <button type="submit">기기 승인 요청</button>
    </form>
    <p id="approval-error" class="error" role="alert"></p>
  </section>

  <section id="protected-area" hidden>
    <section id="editor" class="panel">
      <h2>메모 추가</h2>
      <form id="note-form">
        <label>제목<input id="note-title" maxlength="500" required></label>
        <label>내용<textarea id="note-body" maxlength="5000" required></textarea></label>
        <button type="submit">추가</button>
      </form>
      <p id="note-error" class="error" role="alert"></p>
    </section>
    <ul id="notes" aria-live="polite"></ul>
  </section>
</main>

<script type="module">
  const installStatus = document.querySelector('#install-status');
  const deviceStatus = document.querySelector('#device-status');
  const networkStatus = document.querySelector('#network-status');
  const installButton = document.querySelector('#install-button');
  const authStatus = document.querySelector('#auth-status');
  const authError = document.querySelector('#auth-error');
  const loginForm = document.querySelector('#login-form');
  const signupButton = document.querySelector('#signup-button');
  const logoutButton = document.querySelector('#logout-button');
  const approvalPanel = document.querySelector('#approval-panel');
  const approvalForm = document.querySelector('#approval-form');
  const approvalPassword = document.querySelector('#approval-password');
  const approvalError = document.querySelector('#approval-error');
  const protectedArea = document.querySelector('#protected-area');
  const noteForm = document.querySelector('#note-form');
  const noteError = document.querySelector('#note-error');
  const emailInput = document.querySelector('#email');
  const passwordInput = document.querySelector('#password');
  const titleInput = document.querySelector('#note-title');
  const bodyInput = document.querySelector('#note-body');
  const list = document.querySelector('#notes');
  let installPrompt = null;
  let authenticated = false;
  let approved = false;

  function renderNetworkStatus() {
    networkStatus.textContent = navigator.onLine
      ? '온라인 · 보호 요청은 서버에서 확인합니다.'
      : '오프라인 · 보호 자료는 표시하지 않습니다.';
  }

  function renderInstallStatus() {
    const standalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    if (standalone) {
      installStatus.textContent = '설치된 앱 화면으로 실행 중입니다.';
      installButton.hidden = true;
    } else if (installPrompt) {
      installStatus.textContent = '이 브라우저에서 설치할 수 있습니다.';
      installButton.hidden = false;
    } else {
      installStatus.textContent = '브라우저 메뉴에서 설치 가능 여부를 확인하세요.';
      installButton.hidden = true;
    }
  }

  function renderAccess() {
    authStatus.textContent = authenticated ? '로그인됨' : '로그아웃 상태입니다.';
    loginForm.hidden = authenticated;
    logoutButton.hidden = !authenticated;
    approvalPanel.hidden = !authenticated || approved;
    protectedArea.hidden = !authenticated || !approved;

    if (!authenticated) {
      deviceStatus.textContent = '로그인 후 서버에서 등록 상태를 확인합니다.';
      list.replaceChildren();
    } else if (!approved) {
      deviceStatus.textContent = '승인 전 · 보호 자료는 표시하지 않습니다.';
      list.replaceChildren();
    } else {
      deviceStatus.textContent = '서버 확인 완료 · 등록된 기기입니다.';
    }
  }

  async function jsonFetch(path, options = {}) {
    const response = await fetch(path, {
      ...options,
      credentials: 'same-origin',
      cache: 'no-store',
      headers: {
        ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        ...(options.headers ?? {}),
      },
    });
    if (response.status === 204) return { response, data: null };
    const data = await response.json().catch(() => ({}));
    return { response, data };
  }

  async function refreshDeviceStatus({ load = true } = {}) {
    const { response, data } = await jsonFetch('/api/device/status');
    authenticated = response.ok && data?.authenticated === true;
    approved = authenticated && data?.approved === true;
    renderAccess();
    if (approved && load) await loadNotes();
  }

  async function api(path, options = {}) {
    if (!authenticated || !approved) throw new Error('DEVICE_NOT_APPROVED');
    const { response, data } = await jsonFetch(path, options);
    if (!response.ok) {
      if (response.status === 403 && data?.error === 'DEVICE_NOT_APPROVED') {
        approved = false;
        renderAccess();
      }
      throw new Error(data?.error ?? `HTTP ${response.status}`);
    }
    return data;
  }

  function noteItem(note) {
    const item = document.createElement('li');
    const title = document.createElement('strong');
    const body = document.createElement('span');
    const actions = document.createElement('div');
    const edit = document.createElement('button');
    const remove = document.createElement('button');

    title.textContent = note.title;
    body.textContent = note.body;
    actions.className = 'actions';
    edit.textContent = '수정';
    remove.textContent = '삭제';

    edit.addEventListener('click', async () => {
      const nextTitle = prompt('제목', note.title);
      if (nextTitle === null) return;
      const nextBody = prompt('내용', note.body);
      if (nextBody === null) return;
      try {
        await api(`/api/notes/${encodeURIComponent(note.id)}`, {
          method: 'PUT',
          body: JSON.stringify({ title: nextTitle, body: nextBody }),
        });
        await loadNotes();
      } catch (error) { noteError.textContent = `수정 실패: ${error.message}`; }
    });

    remove.addEventListener('click', async () => {
      if (!confirm('이 메모를 삭제할까요?')) return;
      try {
        await api(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
        await loadNotes();
      } catch (error) { noteError.textContent = `삭제 실패: ${error.message}`; }
    });

    actions.append(edit, remove);
    item.append(title, body, actions);
    return item;
  }

  async function loadNotes() {
    if (!approved) return;
    noteError.textContent = '';
    try {
      const notes = await api('/api/notes');
      if (!Array.isArray(notes)) throw new Error('INVALID_NOTES');
      list.replaceChildren(...(notes.length ? notes.map(noteItem) : [
        Object.assign(document.createElement('li'), { textContent: '아직 내 메모가 없습니다.' }),
      ]));
    } catch (error) {
      list.replaceChildren(Object.assign(document.createElement('li'), { textContent: `자료 읽기 실패: ${error.message}` }));
    }
  }

  renderNetworkStatus();
  renderInstallStatus();
  renderAccess();
  window.addEventListener('online', renderNetworkStatus);
  window.addEventListener('offline', renderNetworkStatus);
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    installPrompt = event;
    renderInstallStatus();
  });
  window.addEventListener('appinstalled', () => {
    installPrompt = null;
    renderInstallStatus();
  });

  installButton.addEventListener('click', async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice.catch(() => null);
    installPrompt = null;
    renderInstallStatus();
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

  loginForm.addEventListener('submit', async event => {
    event.preventDefault();
    authError.textContent = '';
    const { response, data } = await jsonFetch('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email: emailInput.value.trim(), password: passwordInput.value }),
    });
    if (!response.ok) {
      authError.textContent = `로그인 실패: ${data?.error ?? `HTTP ${response.status}`}`;
      return;
    }
    passwordInput.value = '';
    await refreshDeviceStatus();
  });

  signupButton.addEventListener('click', async () => {
    authError.textContent = '';
    const { response, data } = await jsonFetch('/api/auth/signup', {
      method: 'POST',
      body: JSON.stringify({ email: emailInput.value.trim(), password: passwordInput.value }),
    });
    if (!response.ok) {
      authError.textContent = `회원가입 실패: ${data?.error ?? `HTTP ${response.status}`}`;
      return;
    }
    passwordInput.value = '';
    if (data?.authenticated) await refreshDeviceStatus();
    else authError.textContent = '회원가입 요청 완료. 이메일 확인 후 로그인하세요.';
  });

  approvalForm.addEventListener('submit', async event => {
    event.preventDefault();
    approvalError.textContent = '';
    const { response, data } = await jsonFetch('/api/device/approve', {
      method: 'POST',
      body: JSON.stringify({ password: approvalPassword.value }),
    });
    approvalPassword.value = '';
    if (!response.ok || data?.approved !== true) {
      approvalError.textContent = `승인 실패: ${data?.error ?? `HTTP ${response.status}`}`;
      return;
    }
    await refreshDeviceStatus();
  });

  logoutButton.addEventListener('click', async () => {
    await jsonFetch('/api/auth/logout', { method: 'POST' });
    authenticated = false;
    approved = false;
    renderAccess();
  });

  noteForm.addEventListener('submit', async event => {
    event.preventDefault();
    noteError.textContent = '';
    try {
      await api('/api/notes', {
        method: 'POST',
        body: JSON.stringify({ title: titleInput.value, body: bodyInput.value }),
      });
      titleInput.value = '';
      bodyInput.value = '';
      await loadNotes();
    } catch (error) { noteError.textContent = `추가 실패: ${error.message}`; }
  });

  await refreshDeviceStatus();
</script>
</body>
</html>
